# Build flexiConv Windows .exe on every push to main/gui and on demand.
# Download the "flexiConv-windows" artifact from the Actions run, then attach it
# (with your Mac-built DMG) to a GitHub Release.

name: Build Windows exe

on:
  push:
    branches: [ main, gui ]
  workflow_dispatch:   # "Run workflow" button in the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build flexiConv.exe
        run: .\gui\build_win_exe.ps1
        shell: pwsh

      - name: Zip artifact
        run: |
          Compress-Archive -Path gui\dist\flexiConv-windows -DestinationPath flexiConv-windows.zip
        shell: pwsh

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: flexiConv-windows
          path: flexiConv-windows.zip
